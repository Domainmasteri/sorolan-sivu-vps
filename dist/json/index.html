    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }

<body>
    <nav class="language-overlay" aria-label="Kieli">
        <span class="language-overlay__label">Kieli</span>
        <a class="language-overlay__link is-active" href="/json/" aria-current="page">🇫🇮</a>
        <a class="language-overlay__link" href="/en/json-formatter/">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Hyppää pääsisältöön</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko">JSON-muotoilija</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Muotoile ja validoi JSON-dataa suoraan selaimessasi. Kaikki käsittely tapahtuu paikallisesti – mitään ei lähetetä palvelimelle.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2>1. Liitä JSON-data</h2>
                <label for="json-syote" class="sr-only">JSON-syöte</label>
                <textarea id="json-syote" class="syote" placeholder='Liitä JSON-datasi tähän, esim. {"nimi":"Testi","arvo":42}' aria-label="JSON-syöte" spellcheck="false"></textarea>

                <div class="toiminto-rivi">
                    <button id="muotoile-btn" class="nappula">✨ Muotoile</button>
                    <button id="pakkaa-btn" class="nappula1" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;">📦 Pakkaa</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;">🗑️ Tyhjennä</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2>2. Tulos</h2>
                <label for="json-tulos" class="sr-only">Muotoiltu JSON-tulos</label>
                <textarea id="json-tulos" class="syote" readonly placeholder="Tulos näkyy tässä..." aria-label="Muotoiltu JSON-tulos" spellcheck="false"></textarea>

                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;">📋 Kopioi leikepöydälle</button>
                </div>
            </div>
        </main>

        <a href="../" class="linkki-takaisin">« Takaisin pääsivulle</a>
    </div>

    <script>
        const syoteEl = document.getElementById('json-syote');
        const tulosEl = document.getElementById('json-tulos');
        const tilaEl = document.getElementById('tila-viesti');
        const kopiointiBtn = document.getElementById('kopioi-btn');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.className = '';
            tilaEl.textContent = '';
        }

        document.getElementById('muotoile-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Syötekenttä on tyhjä.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                const muotoiltu = JSON.stringify(parsittu, null, 2);
                tulosEl.value = muotoiltu;
                tulosEl.className = 'syote';
                naytaTila('✅ JSON on kelvollinen ja muotoiltu onnistuneesti.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Virheellinen JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('pakkaa-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Syötekenttä on tyhjä.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                tulosEl.value = JSON.stringify(parsittu);
                tulosEl.className = 'syote';
                naytaTila('✅ JSON pakattu onnistuneesti.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Virheellinen JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('tyhjenna-btn').addEventListener('click', () => {
            syoteEl.value = '';
            tulosEl.value = '';
            tulosEl.className = 'syote';
            poistaTila();
        });

        kopiointiBtn.addEventListener('click', async () => {
            const teksti = tulosEl.value;
            if (!teksti) {
                naytaTila('⚠️ Ei kopioitavaa – muotoile ensin JSON.', 'virhe');
                return;
            }
            try {
                await navigator.clipboard.writeText(teksti);
            } catch {
                tulosEl.select();
                document.execCommand('copy');
            }
            const alkuperainen = kopiointiBtn.textContent;
            const alkuperainenVari = kopiointiBtn.style.backgroundColor;
            kopiointiBtn.textContent = '✅ Kopioitu!';
            kopiointiBtn.style.backgroundColor = '#166534';
            setTimeout(() => {
                kopiointiBtn.textContent = alkuperainen;
                kopiointiBtn.style.backgroundColor = alkuperainenVari;
            }, 2000);
        });
    </script>
</body>
