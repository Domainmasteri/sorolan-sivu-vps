<script src="/analytics.js"></script>


    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Sorolan Pastebin",

      "applicationCategory": "DeveloperApplication",

    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); user-select: none; touch-action: none; width: max-content; height: max-content; }
        .language-overlay__label { color: #cbd5e1; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .language-overlay__handle { cursor: grab; }
        .language-overlay__handle:active { cursor: grabbing; }
        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }
        .language-overlay__link:hover, .language-overlay__link:focus-visible { border-color: #ffaa00; color: #ffaa00; outline: none; }
        .language-overlay__link.is-active { background: #ffaa00; color: #111827; border-color: #ffaa00; }
        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: auto; justify-content: center; } }
    </style>
    <script>
    (function(){
      var STORAGE_KEY='lang-overlay-pos';
      function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
      function applyPos(el,x,y){
        el.style.top=y+'px'; el.style.bottom='auto'; el.style.left=x+'px'; el.style.right='auto';
      }
      function restorePos(el){
        try{
          var s=sessionStorage.getItem(STORAGE_KEY);
          if(!s)return;
          var p=JSON.parse(s);
          applyPos(el,clamp(p.x,0,window.innerWidth-el.offsetWidth),clamp(p.y,0,window.innerHeight-el.offsetHeight));
        }catch(e){}
      }
      document.addEventListener('DOMContentLoaded',function(){
        var el=document.getElementById('lang-overlay');
        if(!el)return;
        restorePos(el);
        var handle=el.querySelector('.language-overlay__handle');
        if(!handle)handle=el;
        var startX,startY,origX,origY,dragging=false;
        function onStart(e){
          if(e.target.closest('a'))return;
          dragging=true;
          var rect=el.getBoundingClientRect();
          origX=rect.left; origY=rect.top;
          startX=e.touches?e.touches[0].clientX:e.clientX;
          startY=e.touches?e.touches[0].clientY:e.clientY;
          el.style.transition='none';
          e.preventDefault();
        }
        function onMove(e){
          if(!dragging)return;
          var cx=e.touches?e.touches[0].clientX:e.clientX;
          var cy=e.touches?e.touches[0].clientY:e.clientY;
          var nx=clamp(origX+(cx-startX),0,window.innerWidth-el.offsetWidth);
          var ny=clamp(origY+(cy-startY),0,window.innerHeight-el.offsetHeight);
          applyPos(el,nx,ny);
          e.preventDefault();
        }
        function onEnd(){
          if(!dragging)return;
          dragging=false;
          el.style.transition='';
          try{var r=el.getBoundingClientRect();sessionStorage.setItem(STORAGE_KEY,JSON.stringify({x:r.left,y:r.top}));}catch(e){}
        }
        handle.addEventListener('mousedown',onStart);
        handle.addEventListener('touchstart',onStart,{passive:false});
        document.addEventListener('mousemove',onMove);
        document.addEventListener('touchmove',onMove,{passive:false});
        document.addEventListener('mouseup',onEnd);
        document.addEventListener('touchend',onEnd);
      });
    })();
    </script>
</head>
<body>
    <nav class="language-overlay" aria-label="Kieli" id="lang-overlay" title="Siirrä kielen vaihtaja">
        <span class="language-overlay__label language-overlay__handle">Kieli</span>
        <a class="language-overlay__link is-active" href="/pastebin/" aria-current="page">🇫🇮</a>
        <a class="language-overlay__link" href="/en/pastebin/">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Hyppää sisältöön</a>
    <div class="laatikko" style="max-width: 800px;">
        <h1 class="otsikko">Pastebin</h1>
        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Jaa koodinpätkiä, logeja tai puhdasta tekstiä nopeasti ilman muotoilun rikkoutumista.</p>
        </div>
        
        <main id="paaosio">
            <div class="osion-tausta" id="syotto-alue">
                <div class="flex-form">
                    <label for="paste-content" class="sr-only">Liitä tekstisi</label>
                    <textarea id="paste-content" class="syote" placeholder="Liitä koodi tai teksti tähän..."></textarea>
                </div>
                <button id="tallenna-btn" class="nappula" style="width: 100%;">Tallenna ja luo linkki</button>
            </div>

            <div class="osion-tausta" id="tulos-alue" style="text-align: center;">
                <h2 style="color: #4ade80; border-bottom: 1px solid #2d3748; padding-bottom: 10px;">Teksti tallennettu!</h2>
                <p style="color: #a0aec0; margin-bottom: 15px;">Jaa alla oleva linkki vastaanottajalle.</p>
                <input type="text" id="paste-linkki" class="syote" readonly aria-label="Pastebin linkki" style="width: 100%; box-sizing: border-box; text-align: center; color: #ffaa00; font-weight: bold; margin-bottom: 15px;">
                <div class="flex-form">
                    <button id="kopioi-btn" class="nappula" style="flex: 1;">Kopioi linkki</button>
                    <button id="uusi-btn" class="nappula1" style="flex: 1; background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;">Luo uusi</button>
                </div>
            </div>
        </main>
        <div class="osion-tausta flex-form" style="text-align: center; justify-content: center;">
            <a href="/ohjeet/pastebin" class="linkki-takaisin" style="margin: 0;">📖 Käyttöohjeet</a>
            <a href="/privacy/pastebin" class="linkki-takaisin" style="margin: 0;">🔒 Tietosuojaseloste</a>
        </div>
        <a href="../" class="linkki-takaisin">« Takaisin pääsivulle</a>
    </div>
    
    <script>
        document.getElementById('tallenna-btn').addEventListener('click', async () => {
            const content = document.getElementById('paste-content').value;
            if (!content.trim()) return alert('Tekstikenttä on tyhjä!');
            
            const btn = document.getElementById('tallenna-btn');
            btn.disabled = true;
            btn.textContent = 'Tallennetaan...';

            try {
                const res = await fetch('/api/paste', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('syotto-alue').style.display = 'none';
                    document.getElementById('tulos-alue').style.display = 'block';
                    document.getElementById('paste-linkki').value = window.location.origin + '/p/' + data.path;
                } else {
                    alert(data.error || 'Virhe tallennuksessa');
                }
            } catch (e) {
                alert('Palvelinvirhe yhteydessä.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Tallenna ja luo linkki';
            }
        });

        document.getElementById('kopioi-btn').addEventListener('click', () => {
            const linkki = document.getElementById('paste-linkki');
            linkki.select();
            linkki.setSelectionRange(0, 99999);
            document.execCommand('copy');
            
            const btn = document.getElementById('kopioi-btn');
            const alkuperainen = btn.textContent;
            btn.textContent = 'Kopioitu!';
            btn.style.backgroundColor = '#218838';
            btn.style.color = 'white';
            setTimeout(() => {
                btn.textContent = alkuperainen;
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }, 2000);
        });

        document.getElementById('uusi-btn').addEventListener('click', () => {
            document.getElementById('paste-content').value = '';
            document.getElementById('tulos-alue').style.display = 'none';
            document.getElementById('syotto-alue').style.display = 'block';
        });
    </script>
</body>
</html>
