            background: #0b0d13;
            color: #e2e8f0;
            line-height: 1.5;
            word-break: break-all;
        }
        .jwt-osa {
            width: 100%;
            min-height: 160px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.92rem;

        #tila-viesti.virhe {

    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }

        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }

        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: 12px; justify-content: center; } }

<body>
    <nav class="language-overlay" aria-label="Language">
        <span class="language-overlay__label">Language</span>
        <a class="language-overlay__link" href="/jwt/">🇫🇮</a>
        <a class="language-overlay__link is-active" href="/en/jwt-decoder/" aria-current="page">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Skip to main content</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko">JWT Decoder</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Decode JWT tokens directly in your browser. All processing happens locally – nothing is sent to the server.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2>1. Paste JWT token</h2>
                <label for="jwt-syote" class="sr-only">JWT token</label>
                <textarea id="jwt-syote" class="syote" placeholder="Paste your JWT token here, e.g. ******" aria-label="JWT token" spellcheck="false"></textarea>

                <div class="toiminto-rivi">
                    <button id="pura-btn" class="nappula">🔓 Decode token</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;">🗑️ Clear</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div id="tulos-osio" style="display: none;">
                <div id="vanhentunut-banneri" class="vanhentunut-banneri" role="alert">
                    ⚠️ Token is expired!
                </div>

                <div class="osion-tausta">
                    <h2>2. Header</h2>
                    <div class="osa-otsikko">Algorithm and token type</div>
                    <label for="jwt-header" class="sr-only">JWT Header</label>
                    <textarea id="jwt-header" class="syote jwt-osa" readonly aria-label="JWT Header" spellcheck="false"></textarea>
                </div>

                <div class="osion-tausta">
                    <h2>3. Payload</h2>
                    <div class="osa-otsikko">Token contents</div>
                    <label for="jwt-payload" class="sr-only">JWT Payload</label>
                    <textarea id="jwt-payload" class="syote jwt-osa" readonly aria-label="JWT Payload" spellcheck="false"></textarea>
                </div>
            </div>
        </main>

        <a href="/en/" class="linkki-takaisin">« Back to home</a>
    </div>

    <script>
        const syoteEl = document.getElementById('jwt-syote');
        const tilaEl = document.getElementById('tila-viesti');
        const tulosOsio = document.getElementById('tulos-osio');
        const headerEl = document.getElementById('jwt-header');
        const payloadEl = document.getElementById('jwt-payload');
        const vanhentunutBanneri = document.getElementById('vanhentunut-banneri');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.className = '';
            tilaEl.textContent = '';
        }

        function base64UrlDecode(str) {
            const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
            const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, '=');
            const decoded = atob(padded);
            return decodeURIComponent(
                decoded.split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
            );
        }

        document.getElementById('pura-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Input field is empty.', 'virhe');
                tulosOsio.style.display = 'none';
                return;
            }

            const osat = syote.split('.');
            if (osat.length !== 3) {
                naytaTila('❌ Invalid JWT: token must have three parts (header.payload.signature).', 'virhe');
                tulosOsio.style.display = 'none';
                return;
            }

            let header, payload;
            try {
                header = JSON.parse(base64UrlDecode(osat[0]));
            } catch {
                naytaTila('❌ Invalid JWT: could not decode the header.', 'virhe');
                tulosOsio.style.display = 'none';
                return;
            }
            try {
                payload = JSON.parse(base64UrlDecode(osat[1]));
            } catch {
                naytaTila('❌ Invalid JWT: could not decode the payload.', 'virhe');
                tulosOsio.style.display = 'none';
                return;
            }

            headerEl.value = JSON.stringify(header, null, 2);
            payloadEl.value = JSON.stringify(payload, null, 2);
            tulosOsio.style.display = 'block';

            const nyt = Math.floor(Date.now() / 1000);
            if (typeof payload.exp === 'number' && payload.exp < nyt) {
                vanhentunutBanneri.classList.add('nakyva');
                const expTime = new Date(payload.exp * 1000).toLocaleString('en-GB');
                naytaTila('⚠️ Token expired on ' + expTime + '.', 'varoitus');
            } else {
                vanhentunutBanneri.classList.remove('nakyva');
                naytaTila('✅ Token decoded successfully.', 'ok');
            }
        });

        document.getElementById('tyhjenna-btn').addEventListener('click', () => {
            syoteEl.value = '';
            headerEl.value = '';
            payloadEl.value = '';
            tulosOsio.style.display = 'none';
            vanhentunutBanneri.classList.remove('nakyva');
            poistaTila();
        });
    </script>
</body>
</html>
