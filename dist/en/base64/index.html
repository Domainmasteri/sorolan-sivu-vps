<body>
    <nav class="language-overlay" aria-label="Language">
        <span class="language-overlay__label">Language</span>
        <a class="language-overlay__link" href="/base64/">🇫🇮</a>
        <a class="language-overlay__link is-active" href="/en/base64/" aria-current="page">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Skip to main content</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko">Base64 Encoder / Decoder</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Encode or decode Base64 text directly in your browser. All processing happens locally – nothing is sent to the server.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2>1. Input</h2>
                <label for="b64-syote" class="sr-only">Input text</label>
                <textarea id="b64-syote" class="syote" placeholder="Type or paste your text here..." aria-label="Input text" spellcheck="false"></textarea>

                <div class="toiminto-rivi">
                    <button id="koodaa-btn" class="nappula">🔒 Encode</button>
                    <button id="pura-btn" class="nappula1" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;">🔓 Decode</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;">🗑️ Clear</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2>2. Result</h2>
                <label for="b64-tulos" class="sr-only">Tulos</label>
                <textarea id="b64-tulos" class="syote" readonly placeholder="Result appears here..." aria-label="Result" spellcheck="false"></textarea>

                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;">📋 Copy to clipboard</button>
                </div>
            </div>
        </main>

        <a href="/en/" class="linkki-takaisin">« Back to home</a>
    </div>

    <script>
        const syoteEl = document.getElementById('b64-syote');
        const tulosEl = document.getElementById('b64-tulos');
        const tilaEl = document.getElementById('tila-viesti');
        const kopiointiBtn = document.getElementById('kopioi-btn');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.className = '';
            tilaEl.textContent = '';
        }

        document.getElementById('koodaa-btn').addEventListener('click', () => {
            const syote = syoteEl.value;
            if (!syote) {
                naytaTila('⚠️ Input field is empty.', 'virhe');
                return;
            }
            try {
                const koodattu = btoa(encodeURIComponent(syote).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode(parseInt(p1, 16))));
                tulosEl.value = koodattu;
                tulosEl.className = 'syote';
                naytaTila('✅ Text encoded successfully.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Encoding failed: ' + e.message, 'virhe');
            }
        });

        document.getElementById('pura-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Input field is empty.', 'virhe');
                return;
            }
            try {
                const purettu = decodeURIComponent(atob(syote).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                tulosEl.value = purettu;
                tulosEl.className = 'syote';
                naytaTila('✅ Base64 decoded successfully.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Decoding failed: Input is not valid Base64.', 'virhe');
            }
        });

        document.getElementById('tyhjenna-btn').addEventListener('click', () => {
            syoteEl.value = '';
            tulosEl.value = '';
            tulosEl.className = 'syote';
            poistaTila();
        });

        kopiointiBtn.addEventListener('click', async () => {
            const teksti = tulosEl.value;
            if (!teksti) {
                naytaTila('⚠️ Nothing to copy – encode or decode text first.', 'virhe');
                return;
            }
            try {
                await navigator.clipboard.writeText(teksti);
            } catch {
                tulosEl.select();
                document.execCommand('copy');
            }
            const alkuperainen = kopiointiBtn.textContent;
            const alkuperainenVari = kopiointiBtn.style.backgroundColor;
            kopiointiBtn.textContent = '✅ Copied!';
            kopiointiBtn.style.backgroundColor = '#166534';
            setTimeout(() => {
                kopiointiBtn.textContent = alkuperainen;
                kopiointiBtn.style.backgroundColor = alkuperainenVari;
            }, 2000);
        });
    </script>
</body>
