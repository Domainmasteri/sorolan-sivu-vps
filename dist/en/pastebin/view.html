<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:url" content="https://sorola.fi/en/pastebin/view">
    <meta charset="UTF-8">
    <title>Sorola Pastebin - View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://sorola.fi/en/pastebin/view">
    <link rel="alternate" hreflang="fi" href="https://sorola.fi/pastebin/lue">
    <link rel="alternate" hreflang="en" href="https://sorola.fi/en/pastebin/view">
    <link rel="alternate" hreflang="x-default" href="https://sorola.fi/pastebin/lue">
    <link rel="stylesheet" type="text/css" href="/styles/pohja.css">
    <link rel="icon" type="image/svg+xml" href="/styles/favicon.svg">
    <meta name="description" content="Katsele jaettua koodia tai tekstiä Sorolan Pastebinissa.">
    <meta name="robots" content="noindex, follow">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        .koodi-kontti {
            background: #0b0d13;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            text-align: left;
        }
        pre { margin: 0; }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
<script src="/en/analytics.js"></script>

    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); user-select: none; touch-action: none; width: max-content; height: max-content; }
        .language-overlay__label { color: #cbd5e1; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .language-overlay__handle { cursor: grab; }
        .language-overlay__handle:active { cursor: grabbing; }
        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }
        .language-overlay__link:hover, .language-overlay__link:focus-visible { border-color: #ffaa00; color: #ffaa00; outline: none; }
        .language-overlay__link.is-active { background: #ffaa00; color: #111827; border-color: #ffaa00; }
        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: auto; justify-content: center; } }
    </style>
    <script>
    (function(){
      var STORAGE_KEY='lang-overlay-pos';
      function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
      function applyPos(el,x,y){
        el.style.top=y+'px'; el.style.bottom='auto'; el.style.left=x+'px'; el.style.right='auto';
      }
      function restorePos(el){
        try{
          var s=sessionStorage.getItem(STORAGE_KEY);
          if(!s)return;
          var p=JSON.parse(s);
          applyPos(el,clamp(p.x,0,window.innerWidth-el.offsetWidth),clamp(p.y,0,window.innerHeight-el.offsetHeight));
        }catch(e){}
      }
      document.addEventListener('DOMContentLoaded',function(){
        var el=document.getElementById('lang-overlay');
        if(!el)return;
        restorePos(el);
        var handle=el.querySelector('.language-overlay__handle');
        if(!handle)handle=el;
        var startX,startY,origX,origY,dragging=false;
        function onStart(e){
          if(e.target.closest('a'))return;
          dragging=true;
          var rect=el.getBoundingClientRect();
          origX=rect.left; origY=rect.top;
          startX=e.touches?e.touches[0].clientX:e.clientX;
          startY=e.touches?e.touches[0].clientY:e.clientY;
          el.style.transition='none';
          e.preventDefault();
        }
        function onMove(e){
          if(!dragging)return;
          var cx=e.touches?e.touches[0].clientX:e.clientX;
          var cy=e.touches?e.touches[0].clientY:e.clientY;
          var nx=clamp(origX+(cx-startX),0,window.innerWidth-el.offsetWidth);
          var ny=clamp(origY+(cy-startY),0,window.innerHeight-el.offsetHeight);
          applyPos(el,nx,ny);
          e.preventDefault();
        }
        function onEnd(){
          if(!dragging)return;
          dragging=false;
          el.style.transition='';
          try{var r=el.getBoundingClientRect();sessionStorage.setItem(STORAGE_KEY,JSON.stringify({x:r.left,y:r.top}));}catch(e){}
        }
        handle.addEventListener('mousedown',onStart);
        handle.addEventListener('touchstart',onStart,{passive:false});
        document.addEventListener('mousemove',onMove);
        document.addEventListener('touchmove',onMove,{passive:false});
        document.addEventListener('mouseup',onEnd);
        document.addEventListener('touchend',onEnd);
      });
    })();
    </script>
</head>
<body>
    <nav class="language-overlay" aria-label="Language" id="lang-overlay" title="Drag to move">
        <span class="language-overlay__label language-overlay__handle">Language</span>
        <a class="language-overlay__link" href="/pastebin/lue">🇫🇮</a>
        <a class="language-overlay__link is-active" href="/en/pastebin/view" aria-current="page">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Skip to content</a>
    <div id="paaosio" class="laatikko" style="max-width: 900px;">
        <h1 class="otsikko">Pastebin</h1>
        <div class="osion-tausta">
            <div class="koodi-kontti">
                <pre><code id="koodi-alue" class="language-javascript">Loading text...</code></pre>
            </div>
            <button id="kopioi-sisalto" class="nappula" style="margin-top: 20px; width: 100%;">Copy all text</button>
        </div>
        <a href="/en/pastebin" class="linkki-takaisin">« Create new paste</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js" integrity="sha384-DLX96w7/1q8CY3tN4eR0Nn7K1f2GhJ2/A3ZfTKUm7n0J966auAcNt7r9GEYhr8F0" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Irrotetaan ID pomminvarmasti poistamalla ensin ylimääräinen / lopusta
            const rawPath = window.location.pathname.replace(/\/+$/, '');
            const pasteId = rawPath.split('/').pop();
            const koodiAlue = document.getElementById('koodi-alue');

            try {
                const res = await fetch(`/api/paste/${pasteId}`);
                if (!res.ok) throw new Error('Text not found');
                
                const data = await res.json();
                koodiAlue.textContent = data.content;
                Prism.highlightElement(koodiAlue);
            } catch (err) {
                koodiAlue.textContent = "Error: The text you are looking for was not found or has been deleted.";
            }

            document.getElementById('kopioi-sisalto').addEventListener('click', (e) => {
                const text = koodiAlue.textContent;
                navigator.clipboard.writeText(text);
                const btn = e.target;
                const alkuperainen = btn.textContent;
                btn.textContent = 'Kopioitu!';
                btn.style.backgroundColor = '#218838';
                btn.style.color = 'white';
                setTimeout(() => {
                    btn.textContent = alkuperainen;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
