    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); user-select: none; touch-action: none; width: max-content; height: max-content; }
        .language-overlay__label { color: #cbd5e1; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .language-overlay__handle { cursor: grab; }
        .language-overlay__handle:active { cursor: grabbing; }
        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }
        .language-overlay__link:hover, .language-overlay__link:focus-visible { border-color: #ffaa00; color: #ffaa00; outline: none; }
        .language-overlay__link.is-active { background: #ffaa00; color: #111827; border-color: #ffaa00; }
        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: auto; justify-content: center; } }
    </style>
    <script>
    (function(){
      var STORAGE_KEY='lang-overlay-pos';
      function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
      function applyPos(el,x,y){
        el.style.top=y+'px'; el.style.bottom='auto'; el.style.left=x+'px'; el.style.right='auto';
      }
      function restorePos(el){
        try{
          var s=sessionStorage.getItem(STORAGE_KEY);
          if(!s)return;
          var p=JSON.parse(s);
          applyPos(el,clamp(p.x,0,window.innerWidth-el.offsetWidth),clamp(p.y,0,window.innerHeight-el.offsetHeight));
        }catch(e){}
      }
      document.addEventListener('DOMContentLoaded',function(){
        var el=document.getElementById('lang-overlay');
        if(!el)return;
        restorePos(el);
        var handle=el.querySelector('.language-overlay__handle');
        if(!handle)handle=el;
        var startX,startY,origX,origY,dragging=false;
        function onStart(e){
          if(e.target.closest('a'))return;
          dragging=true;
          var rect=el.getBoundingClientRect();
          origX=rect.left; origY=rect.top;
          startX=e.touches?e.touches[0].clientX:e.clientX;
          startY=e.touches?e.touches[0].clientY:e.clientY;
          el.style.transition='none';
          e.preventDefault();
        }
        function onMove(e){
          if(!dragging)return;
          var cx=e.touches?e.touches[0].clientX:e.clientX;
          var cy=e.touches?e.touches[0].clientY:e.clientY;
          var nx=clamp(origX+(cx-startX),0,window.innerWidth-el.offsetWidth);
          var ny=clamp(origY+(cy-startY),0,window.innerHeight-el.offsetHeight);
          applyPos(el,nx,ny);
          e.preventDefault();
        }
        function onEnd(){
          if(!dragging)return;
          dragging=false;
          el.style.transition='';
          try{var r=el.getBoundingClientRect();sessionStorage.setItem(STORAGE_KEY,JSON.stringify({x:r.left,y:r.top}));}catch(e){}
        }
        handle.addEventListener('mousedown',onStart);
        handle.addEventListener('touchstart',onStart,{passive:false});
        document.addEventListener('mousemove',onMove);
        document.addEventListener('touchmove',onMove,{passive:false});
        document.addEventListener('mouseup',onEnd);
        document.addEventListener('touchend',onEnd);
      });
    })();
    </script>
</head>
<body>
    <nav class="language-overlay" aria-label="Language" id="lang-overlay" title="Drag to move">
        <span class="language-overlay__label language-overlay__handle">Language</span>
        <a class="language-overlay__link" href="/json/">🇫🇮</a>
        <a class="language-overlay__link is-active" href="/en/json-formatter/" aria-current="page">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Skip to main content</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko">JSON Formatter</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Format and validate JSON data directly in your browser. All processing happens locally – nothing is sent to the server.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2>1. Paste JSON data</h2>
                <label for="json-syote" class="sr-only">JSON input</label>
                <textarea id="json-syote" class="syote" placeholder='Paste your JSON here, e.g. {"name":"Test","value":42}' aria-label="JSON input" spellcheck="false"></textarea>

                <div class="toiminto-rivi">
                    <button id="muotoile-btn" class="nappula">✨ Format</button>
                    <button id="pakkaa-btn" class="nappula1" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;">📦 Minify</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;">🗑️ Clear</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2>2. Result</h2>
                <label for="json-tulos" class="sr-only">Formatted JSON result</label>
                <textarea id="json-tulos" class="syote" readonly placeholder="Result appears here..." aria-label="Formatted JSON result" spellcheck="false"></textarea>

                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;">📋 Copy to clipboard</button>
                </div>
            </div>
        </main>

        <div class="osion-tausta flex-form" style="text-align: center; justify-content: center;">
            <a href="/en/guides/json-formatter" class="linkki-takaisin" style="margin: 0;">📖 User Instructions</a>
            <a href="/en/privacy/json-formatter" class="linkki-takaisin" style="margin: 0;">🔒 Privacy Policy</a>
        </div>

        <a href="/en/" class="linkki-takaisin">« Back to home</a>
    </div>

    <script>
        const syoteEl = document.getElementById('json-syote');
        const tulosEl = document.getElementById('json-tulos');
        const tilaEl = document.getElementById('tila-viesti');
        const kopiointiBtn = document.getElementById('kopioi-btn');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.className = '';
            tilaEl.textContent = '';
        }

        document.getElementById('muotoile-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Input field is empty.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                const muotoiltu = JSON.stringify(parsittu, null, 2);
                tulosEl.value = muotoiltu;
                tulosEl.className = 'syote';
                naytaTila('✅ JSON is valid and formatted successfully.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Invalid JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('pakkaa-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Input field is empty.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                tulosEl.value = JSON.stringify(parsittu);
                tulosEl.className = 'syote';
                naytaTila('✅ JSON minified successfully.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Invalid JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('tyhjenna-btn').addEventListener('click', () => {
            syoteEl.value = '';
            tulosEl.value = '';
            tulosEl.className = 'syote';
            poistaTila();
        });

        kopiointiBtn.addEventListener('click', async () => {
            const teksti = tulosEl.value;
            if (!teksti) {
                naytaTila('⚠️ Nothing to copy – format JSON first.', 'virhe');
                return;
            }
            try {
                await navigator.clipboard.writeText(teksti);
            } catch {
                tulosEl.select();
                document.execCommand('copy');
            }
            const alkuperainen = kopiointiBtn.textContent;
            const alkuperainenVari = kopiointiBtn.style.backgroundColor;
            kopiointiBtn.textContent = '✅ Copied!';
            kopiointiBtn.style.backgroundColor = '#166534';
            setTimeout(() => {
                kopiointiBtn.textContent = alkuperainen;
                kopiointiBtn.style.backgroundColor = alkuperainenVari;
            }, 2000);
        });
    </script>
</body>
