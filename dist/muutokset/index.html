    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); user-select: none; touch-action: none; width: max-content; height: max-content; }
        .language-overlay__label { color: #cbd5e1; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .language-overlay__handle { cursor: grab; }
        .language-overlay__handle:active { cursor: grabbing; }
        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }
        .language-overlay__link:hover, .language-overlay__link:focus-visible { border-color: #ffaa00; color: #ffaa00; outline: none; }
        .language-overlay__link.is-active { background: #ffaa00; color: #111827; border-color: #ffaa00; }
        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: auto; justify-content: center; } }
    </style>
    <script>
    (function(){
      var STORAGE_KEY='lang-overlay-pos';
      function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
      function applyPos(el,x,y){
        el.style.top=y+'px'; el.style.bottom='auto'; el.style.left=x+'px'; el.style.right='auto';
      }
      function restorePos(el){
        try{
          var s=sessionStorage.getItem(STORAGE_KEY);
          if(!s)return;
          var p=JSON.parse(s);
          applyPos(el,clamp(p.x,0,window.innerWidth-el.offsetWidth),clamp(p.y,0,window.innerHeight-el.offsetHeight));
        }catch(e){}
      }
      document.addEventListener('DOMContentLoaded',function(){
        var el=document.getElementById('lang-overlay');
        if(!el)return;
        restorePos(el);
        var handle=el.querySelector('.language-overlay__handle');
        if(!handle)handle=el;
        var startX,startY,origX,origY,dragging=false;
        function onStart(e){
          if(e.target.closest('a'))return;
          dragging=true;
          var rect=el.getBoundingClientRect();
          origX=rect.left; origY=rect.top;
          startX=e.touches?e.touches[0].clientX:e.clientX;
          startY=e.touches?e.touches[0].clientY:e.clientY;
          el.style.transition='none';
          e.preventDefault();
        }
        function onMove(e){
          if(!dragging)return;
          var cx=e.touches?e.touches[0].clientX:e.clientX;
          var cy=e.touches?e.touches[0].clientY:e.clientY;
          var nx=clamp(origX+(cx-startX),0,window.innerWidth-el.offsetWidth);
          var ny=clamp(origY+(cy-startY),0,window.innerHeight-el.offsetHeight);
          applyPos(el,nx,ny);
          e.preventDefault();
        }
        function onEnd(){
          if(!dragging)return;
          dragging=false;
          el.style.transition='';
          try{var r=el.getBoundingClientRect();sessionStorage.setItem(STORAGE_KEY,JSON.stringify({x:r.left,y:r.top}));}catch(e){}
        }
        handle.addEventListener('mousedown',onStart);
        handle.addEventListener('touchstart',onStart,{passive:false});
        document.addEventListener('mousemove',onMove);
        document.addEventListener('touchmove',onMove,{passive:false});
        document.addEventListener('mouseup',onEnd);
        document.addEventListener('touchend',onEnd);
      });
    })();
    </script>
</head>
<body>
    <nav class="language-overlay" aria-label="Kieli" id="lang-overlay" title="Siirrä kielen vaihtaja">
        <span class="language-overlay__label language-overlay__handle">Kieli</span>
        <a class="language-overlay__link is-active" href="/muutokset/" aria-current="page">🇫🇮</a>
        <a class="language-overlay__link" href="/en/changes/">🇬🇧</a>
    </nav>
    <button id="admin-toggle-btn" title="Admin-muokkaustila">⚙</button>
    <div class="admin-overlay" id="admin-login-overlay">
        <div class="admin-modal">
            <h3>🔐 Admin-kirjautuminen</h3>
            <div id="admin-error"></div>
            <input type="text" id="admin-u" placeholder="Käyttäjätunnus" autocomplete="username">
            <input type="password" id="admin-p" placeholder="Salasana" autocomplete="current-password">
            <button class="ok" id="admin-login-btn">Kirjaudu</button>
            <button class="cancel" onclick="document.getElementById('admin-login-overlay').classList.remove('open')">Peruuta</button>
        </div>
    </div>
    <div class="admin-overlay" id="admin-changelog-overlay">
        <div class="admin-modal">
            <h3>➕ Lisää muutoslokiin</h3>
            <input type="text" id="changelog-date" placeholder="Päivämäärä (esim. 6.8.2026)">
            <input type="text" id="changelog-title-fi" placeholder="Otsikko (suomi)">
            <input type="text" id="changelog-title-en" placeholder="Title (english)">
            <textarea id="changelog-content-fi" placeholder="Sisältö / kuvaus (suomi)"></textarea>
            <textarea id="changelog-content-en" placeholder="Content / description (english)"></textarea>
            <button class="ok" id="admin-changelog-save">Tallenna</button>
            <button class="cancel" onclick="document.getElementById('admin-changelog-overlay').classList.remove('open')">Peruuta</button>
        </div>
    </div>
    <a href="#paaosio" class="skip-to-content">Hyppää sisältöön</a>
    <div class="laatikko">
        <h1 class="otsikko">Sorolan Sakki</h1>
        <h2 style="font-weight: 700; text-align: center;">⚡ Sivuston muutosloki</h2>
        <br>
        
        <div class="osion-tausta" style="text-align: center;">
            <p style="margin: 0;">
                Tältä sivulta löydät kootusti tietoa sorola.fi-verkkopalvelun ja sen alasivujen tuoreimmista päivityksistä, uusista työkaluista sekä lisätyistä ohjeista.
            </p>
        </div>
        
        <main id="paaosio">
            <button id="changelog-add-btn" class="lisaa-changelog-btn">+ Lisää muutoslokiin</button>

            <a href="/" class="linkki-takaisin">« Takaisin pääsivulle</a>
        </main>
    </div>
    <script>
        (function() {
            var authHeader = null;
            var editMode = false;
            var toggleBtn = document.getElementById('admin-toggle-btn');
            var loginOverlay = document.getElementById('admin-login-overlay');
            var addOverlay = document.getElementById('admin-changelog-overlay');
            var addBtn = document.getElementById('changelog-add-btn');
            var adminError = document.getElementById('admin-error');

            toggleBtn.addEventListener('click', function() {
                if (editMode) {
                    exitEditMode();
                } else if (authHeader) {
                    enterEditMode();
                } else {
                    loginOverlay.classList.add('open');
                    document.getElementById('admin-u').focus();
                }
            });

            document.getElementById('admin-login-btn').addEventListener('click', doLogin);
            document.getElementById('admin-p').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
            addBtn.addEventListener('click', function() {
                document.getElementById('changelog-date').value = '';
                document.getElementById('changelog-title-fi').value = '';
                document.getElementById('changelog-title-en').value = '';
                document.getElementById('changelog-content-fi').value = '';
                document.getElementById('changelog-content-en').value = '';
                addOverlay.classList.add('open');
                document.getElementById('changelog-date').focus();
            });

            async function doLogin() {
                var u = document.getElementById('admin-u').value;
                var p = document.getElementById('admin-p').value;
                if (!u || !p) return;
                var header = 'Bearer ' + btoa(u + ':' + p);
                try {
                    var resp = await fetch('/api/users', { headers: { Authorization: header } });
                    if (!resp.ok) {
                        adminError.textContent = 'Virheelliset tunnukset.';
                        adminError.style.display = 'block';
                        return;
                    }
                    authHeader = header;
                    adminError.style.display = 'none';
                    loginOverlay.classList.remove('open');
                    enterEditMode();
                } catch {
                    adminError.textContent = 'Verkkovirhe.';
                    adminError.style.display = 'block';
                }
            }

            function enterEditMode() {
                editMode = true;
                toggleBtn.classList.add('active');
                toggleBtn.title = 'Poistu muokkaustilasta';
                addBtn.classList.add('admin-active');
                showDeleteButtons();
            }

            function exitEditMode() {
                editMode = false;
                toggleBtn.classList.remove('active');
                toggleBtn.title = 'Admin-muokkaustila';
                addBtn.classList.remove('admin-active');
                document.querySelectorAll('.poista-changelog-btn').forEach(function(btn) { btn.remove(); });
            }

            function showDeleteButtons() {
                document.querySelectorAll('.osion-tausta[data-changelog-id]').forEach(function(block) {
                    if (block.querySelector('.poista-changelog-btn')) return;
                    var id = block.getAttribute('data-changelog-id');
                    var header = block.querySelector('.muutos-pvm');
                    if (!id || !header) return;
                    var btn = document.createElement('button');
                    btn.className = 'poista-changelog-btn';
                    btn.type = 'button';
                    btn.title = 'Poista merkintä';
                    btn.textContent = '🗑';
                    btn.addEventListener('click', function() { deleteChangelog(id, block); });
                    header.appendChild(btn);
                });
            }

            async function deleteChangelog(id, block) {
                if (!confirm('Poistetaanko tämä muutoslokimerkintä?')) return;
                try {
                    var resp = await fetch('/api/admin/changelog/' + id, { method: 'DELETE', headers: { Authorization: authHeader } });
                    if (resp.ok) block.remove();
                    else alert('Poisto epäonnistui.');
                } catch {
                    alert('Verkkovirhe.');
                }
            }

            document.getElementById('admin-changelog-save').addEventListener('click', async function() {
                var payload = {
                    date_str: document.getElementById('changelog-date').value.trim(),
                    title_fi: document.getElementById('changelog-title-fi').value.trim(),
                    title_en: document.getElementById('changelog-title-en').value.trim(),
                    content_fi: document.getElementById('changelog-content-fi').value.trim(),
                    content_en: document.getElementById('changelog-content-en').value.trim()
                };
                if (!payload.date_str || !payload.title_fi || !payload.title_en || !payload.content_fi || !payload.content_en) {
                    alert('Täytä kaikki kentät.');
                    return;
                }
                try {
                    var resp = await fetch('/api/admin/changelog', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: authHeader },
                        body: JSON.stringify(payload)
                    });
                    if (!resp.ok) {
                        var errorData = await resp.json().catch(function() { return {}; });
                        alert(errorData.error || 'Tallennus epäonnistui.');
                        return;
                    }
                    addOverlay.classList.remove('open');
                    window.location.reload();
                } catch {
                    alert('Verkkovirhe.');
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    loginOverlay.classList.remove('open');
                    addOverlay.classList.remove('open');
                }
            });
        })();
    </script>
</body>
