<!DOCTYPE html>
<html lang="fi">
<head>
    <meta property="og:url" content="https://sorola.fi/jako/lataus">
    <meta charset="UTF-8">
    <title>Sorola - Salattu Tiedosto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://sorola.fi/jako/lataus">
    <link rel="alternate" hreflang="fi" href="https://sorola.fi/jako/lataus">
    <link rel="alternate" hreflang="en" href="https://sorola.fi/en/share/download">
    <link rel="alternate" hreflang="x-default" href="https://sorola.fi/jako/lataus">
    <link rel="stylesheet" type="text/css" href="/styles/pohja.css">
    <link rel="icon" type="image/svg+xml" href="/styles/favicon.svg">
    <meta name="description" content="Lataa ja pura jaettu salattu tiedosto selaimessasi.">
    <meta name="robots" content="noindex, follow">
    <!-- Privacy-friendly analytics by Plausible -->
<script src="/analytics.js"></script>

    <style>
        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }
        .language-overlay__label { color: #cbd5e1; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .language-overlay__link { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 8px 12px; border-radius: 999px; border: 1px solid #334155; color: #f8fafc; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: all 0.2s ease; }
        .language-overlay__link:hover, .language-overlay__link:focus-visible { border-color: #ffaa00; color: #ffaa00; outline: none; }
        .language-overlay__link.is-active { background: #ffaa00; color: #111827; border-color: #ffaa00; }
        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: 12px; justify-content: center; } }
    </style>
</head>
<body>
    <nav class="language-overlay" aria-label="Kieli">
        <span class="language-overlay__label">Kieli</span>
        <a class="language-overlay__link is-active" href="/jako/lataus" aria-current="page">🇫🇮</a>
        <a class="language-overlay__link" href="/en/share/download">🇬🇧</a>
    </nav>
    <div class="laatikko" style="max-width: 650px; text-align: center;">
        <h1 class="otsikko">Salattu Tiedosto</h1>
        <div class="osion-tausta" id="status-alue">
            <p id="teksti" style="margin: 0; font-weight: bold; color: #ffaa00;">Ladataan ja puretaan salausta selaimessa...</p>
            <button id="lataaNappi" class="nappula" style="margin-top: 20px; width: 100%; display: none;">Tallenna tiedosto koneelle</button>
        </div>
        <a href="/" class="linkki-takaisin" style="margin-top: 20px;">« Takaisin pääsivulle</a>
    </div>

    <script>
        let decryptedBlob = null;
        let originalFilename = "tiedosto.enc";

        async function puraTiedosto() {
            // Etsitään ID varmasti
            let fileId = window.location.pathname.replace(/\/+$/, '').split('/').pop();
            if (fileId.includes('.html') || fileId === 's' || !fileId) {
                const urlParams = new URLSearchParams(window.location.search);
                fileId = urlParams.get('file');
            }
            const hashKey = window.location.hash.substring(1).replace('key=', '');

            const teksti = document.getElementById('teksti');
            const lataaNappi = document.getElementById('lataaNappi');

            if (!fileId || !hashKey) {
                teksti.textContent = "Virhe: Puuttuva tiedosto-ID tai salausavain.";
                teksti.style.color = "#ef4444";
                return;
            }

            try {
                // Haetaan raaka salattu tiedosto. 
                const res = await fetch(`/d/${fileId}`);
                if (!res.ok) throw new Error('Tiedostoa ei löytynyt tai se on vanhentunut.');
                const encryptedArrayBuffer = await res.arrayBuffer();

                // Korjataan base64 padding! Selaimen atob kaatuu, jos täytemerkit puuttuvat
                let b64 = hashKey.replace(/-/g, '+').replace(/_/g, '/');
                const pad = b64.length % 4;
                if (pad) {
                    b64 += '='.repeat(4 - pad);
                }

                // Nyt atob ei enää kaadu
                const binStr = atob(b64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

                const cryptoKey = await window.crypto.subtle.importKey(
                    "raw", bytes.buffer, { name: "AES-GCM" }, false, ["decrypt"]
                );

                const iv = encryptedArrayBuffer.slice(0, 12);
                const data = encryptedArrayBuffer.slice(12);

                const decryptedContent = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: new Uint8Array(iv) }, cryptoKey, data
                );

                decryptedBlob = new Blob([decryptedContent]);

                const contentDisp = res.headers.get('Content-Disposition');
                if (contentDisp && contentDisp.includes('filename=')) {
                    const matches = contentDisp.match(/filename="?([^"]+)"?/);
                    if (matches && matches[1]) originalFilename = matches[1];
                } else {
                    originalFilename = fileId;
                }

                teksti.textContent = "Tiedosto purettu onnistuneesti! Voit ladata sen koneellesi.";
                teksti.style.color = "#4ade80";
                lataaNappi.style.display = 'block';

            } catch (err) {
                console.error(err);
                teksti.textContent = "Purku epäonnistui. Väärä avain tai tiedosto on vioittunut.";
                teksti.style.color = "#ef4444";
            }
        }

        document.getElementById('lataaNappi').addEventListener('click', () => {
            if (!decryptedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(decryptedBlob);
            a.download = originalFilename.replace('.enc', '');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        window.addEventListener('DOMContentLoaded', puraTiedosto);
    </script>
</body>
</html>
