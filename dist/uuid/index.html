        .language-overlay { position: fixed; top: 16px; left: 16px; z-index: 10001; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255, 170, 0, 0.35); background: rgba(11, 13, 19, 0.92); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }

        @media (max-width: 768px) { .language-overlay { top: auto; bottom: 12px; left: 12px; right: 12px; justify-content: center; } }

<body>
    <nav class="language-overlay" aria-label="Kieli">
        <span class="language-overlay__label">Kieli</span>
        <a class="language-overlay__link is-active" href="/uuid/" aria-current="page">🇫🇮</a>
        <a class="language-overlay__link" href="/en/uuid/">🇬🇧</a>
    </nav>
    <a href="#paaosio" class="skip-to-content">Hyppää pääsisältöön</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko">UUID / GUID Generator (v4)</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;">Luo satunnaisia UUID v4 -tunnisteita turvallisesti paikallisesti selaimessa (crypto.randomUUID()).</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2>Luo tunnisteita</h2>
                <div class="toiminto-rivi">
                    <button class="nappula" data-maara="1">Luo 1 UUID</button>
                    <button class="nappula1" data-maara="5" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;">Luo 5 UUID:tä</button>
                    <button class="nappula1" data-maara="10" style="background: #191f2d; color: #60a5fa; border: 1px solid #60a5fa;">Luo 10 UUID:tä</button>
                </div>
                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2>Tulokset</h2>
                <label for="uuid-tulos" class="sr-only">UUID-tulokset</label>
                <textarea id="uuid-tulos" class="syote" readonly placeholder="Luodut UUID:t näkyvät tässä..." aria-label="UUID-tulokset" spellcheck="false"></textarea>
                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;">📋 Kopioi leikepöydälle</button>
                </div>
            </div>
        </main>

        <a href="../" class="linkki-takaisin">« Takaisin pääsivulle</a>
    </div>

    <script>
        const tulosEl = document.getElementById('uuid-tulos');
        const tilaEl = document.getElementById('tila-viesti');
        const kopiointiBtn = document.getElementById('kopioi-btn');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.textContent = '';
            tilaEl.className = '';
        }

        function luoUuidit(maara) {
            if (!window.crypto || typeof window.crypto.randomUUID !== 'function') {
                tulosEl.value = '';
                naytaTila('❌ Selaimesi ei tue crypto.randomUUID()-toimintoa.', 'virhe');
                return;
            }

            const uuidit = Array.from({ length: maara }, () => window.crypto.randomUUID());
            tulosEl.value = uuidit.join('\n');
            naytaTila(`✅ Luotiin ${maara} UUID-tunnistetta.`, 'ok');
        }

        document.querySelectorAll('[data-maara]').forEach((painike) => {
            painike.addEventListener('click', () => {
                const maara = Number.parseInt(painike.getAttribute('data-maara'), 10);
                luoUuidit(maara);
            });
        });

        kopiointiBtn.addEventListener('click', async () => {
            const teksti = tulosEl.value.trim();
            if (!teksti) {
                naytaTila('⚠️ Ei kopioitavaa – luo UUID ensin.', 'virhe');
                return;
            }

            try {
                await navigator.clipboard.writeText(teksti);
            } catch {
                tulosEl.select();
                document.execCommand('copy');
            }

            const alkuperainen = kopiointiBtn.textContent;
            const alkuperainenVari = kopiointiBtn.style.backgroundColor;
            kopiointiBtn.textContent = '✅ Kopioitu!';
            kopiointiBtn.style.backgroundColor = '#166534';
            setTimeout(() => {
                kopiointiBtn.textContent = alkuperainen;
                kopiointiBtn.style.backgroundColor = alkuperainenVari;
            }, 2000);

            poistaTila();
            naytaTila('✅ UUID:t kopioitu leikepöydälle.', 'ok');
        });
    </script>
</body>
</html>
