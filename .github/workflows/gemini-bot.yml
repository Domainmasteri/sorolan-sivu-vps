name: Gemini AI Coder Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  gemini-coder:
    # Aja vain jos uudessa issuessa tai kommentissa lukee "/gemini"
    if: contains(github.event.issue.body, '/gemini') || contains(github.event.comment.body, '/gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Gemini AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Nappaa tekstin joko kommentista tai suoraan issuen rungosta
          PROMPT_TEXT: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          # Asennetaan Aider-tekoälyagentti taustalle
          pip install --quiet aider-chat

          # 1. Siivotaan "/gemini"-sana pois viestistä, jotta Aider ei luule sitä omaksi komennokseen
          CLEAN_PROMPT=$(echo "$PROMPT_TEXT" | sed 's/\/gemini//ig' | xargs)

          # 2. Ajetaan Gemini puhtaalla viestillä ja estetään historiatiedostojen tallennus
          aider --model gemini/gemini-2.5-pro \
                --message "$CLEAN_PROMPT" \
                --yes \
                --no-git \
                --no-history

          # 3. Varmistetaan vielä, ettei repon juureen jää mitään Aiderin lokitiedostoja sotkemaan PR:ää
          rm -f .aider*

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(ai): Geminin tekemä koodimuutos issueen #${{ github.event.issue.number }}"
          branch: "ai/gemini-fix-${{ github.event.issue.number }}"
          title: "🤖 Gemini AI: Korjaus issueen #${{ github.event.issue.number }}"
          body: |
            Tämä Pull Request on luotu automaattisesti Geminin avulla.
            
            Liittyy issueen #${{ github.event.issue.number }}.
