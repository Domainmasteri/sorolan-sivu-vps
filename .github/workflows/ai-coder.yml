name: AI Coder (Gemini)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-code:
    # Liipaistuu vain kun Issueen lisätään label "ai-code"
    if: github.event.label.name == 'ai-code'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Aider tarvitsee git-historiaa ymmärtääkseen repon rakenteen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          pip install --upgrade aider-chat

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aider muokkaa tai luo tiedostot Issuen ohjeen mukaan ilman suoraa committia
          aider --model gemini/gemini-2.5-pro \
                --message "Tehtävä: $ISSUE_TITLE. Lisätiedot: $ISSUE_BODY" \
                --yes-always \
                --no-auto-commits

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai-feature/issue-${{ github.event.issue.number }}
          title: "AI: ${{ github.event.issue.title }}"
          body: |
            Tämä Pull Request on generoitu automaattisesti Issuen #${{ github.event.issue.number }} pohjalta.
            
            **Pyyntö:**
            > ${{ github.event.issue.body }}
          labels: ai-generated
          delete-branch: true

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Valmista! Koodi on generoitu ja uusi Pull Request on avattu tarkistettavaksi.'
            })
