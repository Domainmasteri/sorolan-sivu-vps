<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" type="text/css" href="/styles/pohja.css">
    <link rel="icon" type="image/svg+xml" href="/styles/favicon.svg">
    <meta name="description" content="Luo vahvoja ja turvallisia salasanoja ilmaiseksi. Valitse pituus ja merkkityypit – salasana generoidaan suoraan selaimessasi, ei palvelimella." data-i18n-attr-content="salasanat.luo_vahvoja_ja_turvallisia_salasanoja_ilmaiseksi_v">
    <meta name="keywords" content="salasanageneraattori, salasana, vahva salasana, satunnainen salasana, salasanakone, password generator, Sorola">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorola.fi/salasanat/">
    <meta property="og:site_name" content="Sorolan Sakki">
    <meta property="og:title" content="Sorolan Salasanakone" data-i18n-attr-content="salasanat.sorolan_salasanakone">
    <meta property="og:description" content="Luo vahvoja salasanoja selaimessasi turvallisesti." data-i18n-attr-content="salasanat.luo_vahvoja_salasanoja_selaimessasi_turvallisesti">
        <meta property="og:locale" content="fi_FI" data-i18n-attr-content="muutokset.fi_fi">
    <meta property="og:image" content="https://sorola.fi/styles/og-image.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Sorolan Salasanakone" data-i18n-attr-content="salasanat.sorolan_salasanakone">
    <meta name="twitter:description" content="Luo vahvoja salasanoja selaimessasi turvallisesti." data-i18n-attr-content="salasanat.luo_vahvoja_salasanoja_selaimessasi_turvallisesti">
    <style>
        /* Salasanakoneen omat mukautetut asettelut uuteen teemaan sopiviksi */
        .asetus-rivi {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            user-select: none;
        }
        .asetus-rivi input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #ffaa00; /* Muuttaa ruksit teeman värisiksi */
        }
        .slider-kontti {
            margin-bottom: 25px;
            color: white;
            font-size: 1.1rem;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            accent-color: #ffaa00;
        }
        #valmis-salasana {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            color: #ffaa00;
            background: #0b0d13;
            border: 1px solid #2d3748;
        }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
<script src="/analytics.js"></script>


    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sorolan Salasanakone",
      "url": "https://sorola.fi/salasanat/",
      "description": "Luo vahvoja ja turvallisia salasanoja ilmaiseksi suoraan selaimessasi.",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
    </script>
</head>
<body>
    <a href="#paaosio" class="skip-to-content" data-i18n="common.hyppää_pääsisältöön">Hyppää pääsisältöön</a>

    <div class="laatikko">
        <h1 class="otsikko" data-i18n="salasanat.salasanakone">Salasanakone</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;" data-i18n="salasanat.luo_vahvoja_ja_turvallisia_salasanoja_murtovarmuud">Luo vahvoja ja turvallisia salasanoja murtovarmuuden parantamiseksi. Valitse pituus ja merkit alta.</p>
        </div>

        <main id="paaosio">
        <div class="osion-tausta">
            <h2 data-i18n="salasanat.1_muokkaa_asetuksia">1. Muokkaa asetuksia</h2>
            
            <div class="slider-kontti">
                <label for="pituus-slider">Salasanan pituus: <span id="pituus-arvo" style="color: #ffaa00; font-weight: bold;">16</span> merkkiä</label>
                <input type="range" id="pituus-slider" min="6" max="32" value="16">
            </div>

            <label class="asetus-rivi">
                <input type="checkbox" id="pienet-kirjaimet" checked>
                Sisällytä pieniä kirjaimia (a-z)
            </label>
            
            <label class="asetus-rivi">
                <input type="checkbox" id="isot-kirjaimet" checked>
                Sisällytä isoja kirjaimia (A-Z)
            </label>
            
            <label class="asetus-rivi">
                <input type="checkbox" id="numerot" checked>
                Sisällytä numeroita (0-9)
            </label>
            
            <label class="asetus-rivi">
                <input type="checkbox" id="erikoismerkit" checked>
                Sisällytä erikoismerkkejä (!@#$%)
            </label>

            <button id="luo-btn" class="nappula" style="margin-top: 15px;" data-i18n="salasanat.arvo_uusi_salasana">🎲 Arvo uusi salasana</button>
        </div>

        <div class="osion-tausta" style="text-align: center;">
            <h2 data-i18n="salasanat.valmis_salasana">Valmis salasana</h2>
            
            <div style="margin-bottom: 20px;">
                <label for="valmis-salasana" class="sr-only" data-i18n="salasanat.generoitu_salasana">Generoitu salasana</label>
                <input type="text" id="valmis-salasana" class="syote" readonly placeholder="Paina Arvo-nappia" aria-label="Generoitu salasana" data-i18n-attr-placeholder="salasanat.paina_arvonappia" data-i18n-attr-aria-label="salasanat.generoitu_salasana">
            </div>
            
            <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;" data-i18n="salasanat.kopioi_leikepöydälle">📋 Kopioi leikepöydälle</button>
        </div>
        </main>

        <a href="../" class="linkki-takaisin" data-i18n="common.takaisin_pääsivulle_nuoli">← Takaisin pääsivulle</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
