    <script type="application/ld+json">

<body>
    <a href="#paaosio" class="skip-to-content" data-i18n="common.hyppää_pääsisältöön">Hyppää pääsisältöön</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko" data-i18n="base64.base64_kooderi_dekooderi">Base64 Kooderi / Dekooderi</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;" data-i18n="base64.koodaa_tai_pura_base64tekstiä_suoraan_selaimessasi">Koodaa tai pura Base64-tekstiä suoraan selaimessasi. Kaikki käsittely tapahtuu paikallisesti – mitään ei lähetetä palvelimelle.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2 data-i18n="base64.1_syöte">1. Syöte</h2>
                <label for="b64-syote" class="sr-only" data-i18n="base64.syöteteksti">Syöteteksti</label>
                <textarea id="b64-syote" class="syote" placeholder="Kirjoita tai liitä teksti tähän..." aria-label="Syöteteksti" spellcheck="false" data-i18n-attr-placeholder="base64.kirjoita_tai_liitä_teksti_tähän" data-i18n-attr-aria-label="base64.syöteteksti"></textarea>

                <div class="toiminto-rivi">
                    <button id="koodaa-btn" class="nappula" data-i18n="base64.koodaa_encode">🔒 Koodaa (Encode)</button>
                    <button id="pura-btn" class="nappula1" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;" data-i18n="base64.pura_decode">🔓 Pura (Decode)</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;" data-i18n="json.tyhjennä">🗑️ Tyhjennä</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2 data-i18n="json.2_tulos">2. Tulos</h2>
                <label for="b64-tulos" class="sr-only" data-i18n="base64.tulos">Tulos</label>
                <textarea id="b64-tulos" class="syote" readonly placeholder="Tulos näkyy tässä..." aria-label="Tulos" spellcheck="false" data-i18n-attr-placeholder="json.tulos_näkyy_tässä" data-i18n-attr-aria-label="base64.tulos"></textarea>

                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;" data-i18n="salasanat.kopioi_leikepöydälle">📋 Kopioi leikepöydälle</button>
                </div>
            </div>
        </main>

        <div class="osion-tausta flex-form" style="text-align: center; justify-content: center;">
            <a href="/ohjeet/base64" class="linkki-takaisin" style="margin: 0;" data-i18n="common.lue_ohjeet">📖 Käyttöohjeet</a>
