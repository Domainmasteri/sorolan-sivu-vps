<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title data-i18n="json.sorolan_jsonmuotoilija_muotoile_ja_validoi_json">Sorolan JSON-muotoilija - Muotoile ja validoi JSON</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://sorola.fi/json/">
    <link rel="stylesheet" type="text/css" href="/styles/pohja.css">
    <link rel="icon" type="image/svg+xml" href="/styles/favicon.svg">
    <meta name="description" content="Muotoile ja validoi JSON-dataa ilmaiseksi suoraan selaimessasi. Nopea ja helppokäyttöinen JSON-muotoilija ja -tarkistaja." data-i18n-attr-content="json.muotoile_ja_validoi_jsondataa_ilmaiseksi_suoraan_s">
    <meta name="keywords" content="JSON muotoilija, JSON validaattori, JSON formatter, JSON validator, Sorola" data-i18n-attr-content="json.json_muotoilija_json_validaattori_json_formatter_j">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorola.fi/json/">
    <meta property="og:site_name" content="Sorolan Sakki">
    <meta property="og:title" content="Sorolan JSON-muotoilija" data-i18n-attr-content="json.sorolan_jsonmuotoilija">
    <meta property="og:description" content="Muotoile ja validoi JSON-dataa ilmaiseksi selaimessasi." data-i18n-attr-content="json.muotoile_ja_validoi_jsondataa_ilmaiseksi_selaimess">
        <meta property="og:locale" content="fi_FI" data-i18n-attr-content="muutokset.fi_fi">
    <meta property="og:image" content="https://sorola.fi/styles/og-image.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Sorolan JSON-muotoilija" data-i18n-attr-content="json.sorolan_jsonmuotoilija">
    <meta name="twitter:description" content="Muotoile ja validoi JSON-dataa ilmaiseksi selaimessasi." data-i18n-attr-content="json.muotoile_ja_validoi_jsondataa_ilmaiseksi_selaimess">
    <style>
        #json-syote,
        #json-tulos {
            width: 100%;
            min-height: 220px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.92rem;
            resize: vertical;
            box-sizing: border-box;
            background: #0b0d13;
            color: #e2e8f0;
            line-height: 1.5;
        }
        #json-tulos {
            color: #4ade80;
        }
        #json-tulos.virhe {
            color: #f87171;
        }
        .toiminto-rivi {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .toiminto-rivi .nappula,
        .toiminto-rivi .nappula1 {
            flex: 1;
            min-width: 120px;
        }
        #tila-viesti {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
        }
        #tila-viesti.ok {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid #4ade80;
            color: #4ade80;
            display: block;
        }
        #tila-viesti.virhe {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid #f87171;
            color: #f87171;
            display: block;
        }
        .kopioi-btn-kontti {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        #kopioi-btn {
            min-width: 180px;
        }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
<script src="/analytics.js"></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sorolan JSON-muotoilija",
      "url": "https://sorola.fi/json/",
      "description": "Muotoile ja validoi JSON-dataa ilmaiseksi suoraan selaimessasi.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
    </script>
</head>
<body>
    <a href="#paaosio" class="skip-to-content" data-i18n="common.hyppää_pääsisältöön">Hyppää pääsisältöön</a>

    <div class="laatikko" style="max-width: 860px;">
        <h1 class="otsikko" data-i18n="json.jsonmuotoilija">JSON-muotoilija</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;" data-i18n="json.muotoile_ja_validoi_jsondataa_suoraan_selaimessasi">Muotoile ja validoi JSON-dataa suoraan selaimessasi. Kaikki käsittely tapahtuu paikallisesti – mitään ei lähetetä palvelimelle.</p>
        </div>

        <main id="paaosio">
            <div class="osion-tausta">
                <h2 data-i18n="json.1_liitä_jsondata">1. Liitä JSON-data</h2>
                <label for="json-syote" class="sr-only" data-i18n="json.jsonsyöte">JSON-syöte</label>
                <textarea id="json-syote" class="syote" placeholder='Liitä JSON-datasi tähän, esim. {"nimi":"Testi","arvo":42}' aria-label="JSON-syöte" spellcheck="false" data-i18n-attr-placeholder="json.liitä_json_datasi_tähän" data-i18n-attr-aria-label="json.jsonsyöte"></textarea>

                <div class="toiminto-rivi">
                    <button id="muotoile-btn" class="nappula" data-i18n="json.muotoile">✨ Muotoile</button>
                    <button id="pakkaa-btn" class="nappula1" style="background: #191f2d; color: #ffaa00; border: 1px solid #ffaa00;" data-i18n="json.pakkaa">📦 Pakkaa</button>
                    <button id="tyhjenna-btn" class="nappula1" style="background: #191f2d; color: #a0aec0; border: 1px solid #4a5568;" data-i18n="json.tyhjennä">🗑️ Tyhjennä</button>
                </div>

                <div id="tila-viesti" role="status" aria-live="polite"></div>
            </div>

            <div class="osion-tausta">
                <h2 data-i18n="json.2_tulos">2. Tulos</h2>
                <label for="json-tulos" class="sr-only" data-i18n="json.muotoiltu_jsontulos">Muotoiltu JSON-tulos</label>
                <textarea id="json-tulos" class="syote" readonly placeholder="Tulos näkyy tässä..." aria-label="Muotoiltu JSON-tulos" spellcheck="false" data-i18n-attr-placeholder="json.tulos_näkyy_tässä" data-i18n-attr-aria-label="json.muotoiltu_jsontulos"></textarea>

                <div class="kopioi-btn-kontti">
                    <button id="kopioi-btn" class="nappula" style="background-color: #218838; color: white;" data-i18n="salasanat.kopioi_leikepöydälle">📋 Kopioi leikepöydälle</button>
                </div>
            </div>
        </main>

        <div class="osion-tausta flex-form" style="text-align: center; justify-content: center;">
            <a href="/ohjeet/json" class="linkki-takaisin" style="margin: 0;" data-i18n="common.lue_ohjeet">📖 Käyttöohjeet</a>
            <a href="/privacy/json" class="linkki-takaisin" style="margin: 0;" data-i18n="common.lue_tietosuoja">🔒 Tietosuojaseloste</a>
        </div>

        <a href="../" class="linkki-takaisin" data-i18n="common.takaisin_pääsivulle">« Takaisin pääsivulle</a>
    </div>

    <script>
        const syoteEl = document.getElementById('json-syote');
        const tulosEl = document.getElementById('json-tulos');
        const tilaEl = document.getElementById('tila-viesti');
        const kopiointiBtn = document.getElementById('kopioi-btn');

        function naytaTila(viesti, tyyppi) {
            tilaEl.textContent = viesti;
            tilaEl.className = tyyppi;
        }

        function poistaTila() {
            tilaEl.className = '';
            tilaEl.textContent = '';
        }

        document.getElementById('muotoile-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Syötekenttä on tyhjä.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                const muotoiltu = JSON.stringify(parsittu, null, 2);
                tulosEl.value = muotoiltu;
                tulosEl.className = 'syote';
                naytaTila('✅ JSON on kelvollinen ja muotoiltu onnistuneesti.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Virheellinen JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('pakkaa-btn').addEventListener('click', () => {
            const syote = syoteEl.value.trim();
            if (!syote) {
                naytaTila('⚠️ Syötekenttä on tyhjä.', 'virhe');
                return;
            }
            try {
                const parsittu = JSON.parse(syote);
                tulosEl.value = JSON.stringify(parsittu);
                tulosEl.className = 'syote';
                naytaTila('✅ JSON pakattu onnistuneesti.', 'ok');
            } catch (e) {
                tulosEl.value = '';
                tulosEl.className = 'syote virhe';
                naytaTila('❌ Virheellinen JSON: ' + e.message, 'virhe');
            }
        });

        document.getElementById('tyhjenna-btn').addEventListener('click', () => {
            syoteEl.value = '';
            tulosEl.value = '';
            tulosEl.className = 'syote';
            poistaTila();
        });

        kopiointiBtn.addEventListener('click', async () => {
            const teksti = tulosEl.value;
            if (!teksti) {
                naytaTila('⚠️ Ei kopioitavaa – muotoile ensin JSON.', 'virhe');
                return;
            }
            try {
                await navigator.clipboard.writeText(teksti);
            } catch {
                tulosEl.select();
                document.execCommand('copy');
            }
            const alkuperainen = kopiointiBtn.textContent;
            const alkuperainenVari = kopiointiBtn.style.backgroundColor;
            kopiointiBtn.textContent = '✅ Kopioitu!';
            kopiointiBtn.style.backgroundColor = '#166534';
            setTimeout(() => {
                kopiointiBtn.textContent = alkuperainen;
                kopiointiBtn.style.backgroundColor = alkuperainenVari;
            }, 2000);
        });
    </script>
</body>
</html>
