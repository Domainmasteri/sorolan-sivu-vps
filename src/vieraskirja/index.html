<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title data-i18n="common.vieraskirja_sorolan_sakki">Vieraskirja - Sorolan Sakki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://sorola.fi/vieraskirja/">
    <link rel="stylesheet" type="text/css" href="/styles/pohja.css">
    <link rel="icon" type="image/svg+xml" href="/styles/favicon.svg">
    <meta name="description" content="Jätä terveisesi Sorolan perheelle vieraskirjassa. Sana on vapaa!" data-i18n-attr-content="vieraskirja.jätä_terveisesi_sorolan_perheelle_vieraskirjassa_s">
    <meta name="keywords" content="vieraskirja, Sorola, Sorolan Sakki, tervehdys, palaute">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorola.fi/vieraskirja/">
    <meta property="og:site_name" content="Sorolan Sakki">
    <meta property="og:title" content="Vieraskirja - Sorolan Sakki" data-i18n-attr-content="common.vieraskirja_sorolan_sakki">
    <meta property="og:description" content="Jätä terveisesi Sorolan perheelle vieraskirjassa.">
    <style>
        .ilmoitus { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .virhe { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .onnistui { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .piilotettu { display: none !important; }

        .viestikortti {
            background: #191f2d;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .viestikortti.yllapito-viesti {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.06);
        }
        .viestikortti-otsikko {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .viestikortti-nimi {
            font-weight: 700;
            font-size: 1rem;
            color: #e2e8f0;
        }
        .viestikortti.yllapito-viesti .viestikortti-nimi {
            color: #ffaa00;
        }
        .yllapito-merkki {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(255, 170, 0, 0.4);
        }
        .viestikortti-aika {
            font-size: 0.78rem;
            color: #718096;
            margin-left: auto;
        }
        .viestikortti-teksti {
            color: #cbd5e0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .admin-vastaus {
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(255, 170, 0, 0.08);
            border-left: 3px solid #ffaa00;
            border-radius: 0 8px 8px 0;
        }
        .admin-vastaus-otsikko {
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffaa00;
            margin-bottom: 5px;
        }
        .admin-vastaus-teksti {
            color: #cbd5e0;
            font-size: 0.92rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .lataus-spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid rgba(255,170,0,0.3);
            border-radius: 50%;
            border-top-color: #ffaa00;
            animation: pyori 1s ease-in-out infinite;
        }
        @keyframes pyori { to { transform: rotate(360deg); } }

        .flex-form { display: flex; flex-direction: column; gap: 10px; }
        .captcha-rivi { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .captcha-kysymys {
            font-weight: 700;
            font-size: 1.05rem;
            color: #e2e8f0;
            background: #0b0d13;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 9px 15px;
            white-space: nowrap;
        }
    </style>
    <!-- Privacy-friendly analytics by Plausible -->
<script src="/js/analytics.js"></script>

</head>
<body>
    <a href="#paaosio" class="skip-to-content" data-i18n="common.hyppää_pääsisältöön">Hyppää pääsisältöön</a>

    <div class="laatikko" style="max-width: 700px;">
        <h1 class="otsikko" data-i18n="vieraskirja.vieraskirja">Vieraskirja</h1>

        <div class="osion-tausta">
            <p style="margin: 0; text-align: center;" data-i18n="vieraskirja.jätä_puumerkkisi_ja_terveiset_sorolan_perheelle_sa">Jätä puumerkkisi ja terveiset Sorolan perheelle! Sana on vapaa.</p>
        </div>

        <main id="paaosio">
            <!-- Lomake -->
            <div class="osion-tausta">
                <h2 style="margin-top: 0; color: #ffaa00; border-bottom: 2px solid #2d3748; padding-bottom: 8px;" data-i18n="vieraskirja.jätä_viesti_otsikko" data-i18n="vieraskirja.jätä_viesti_otsikko">✍️ Jätä viesti</h2>
                <div id="lomake-ilmoitus" class="ilmoitus piilotettu"></div>
                <div class="flex-form">
                    <input type="text" id="gb-nimi" class="syote" placeholder="Nimesi" maxlength="100" autocomplete="name" data-i18n-attr-placeholder="vieraskirja.nimesi">
                    <textarea id="gb-viesti" class="syote" placeholder="Viestisi..." rows="4" maxlength="2000" style="resize: vertical; min-height: 90px;" data-i18n-attr-placeholder="vieraskirja.viestisi"></textarea>
                    <div class="captcha-rivi">
                        <span id="captcha-kysymys" class="captcha-kysymys" aria-live="polite"></span>
                        <input type="number" id="captcha-vastaus" class="syote" placeholder="Vastaus" style="width: 90px; flex: 0 0 90px;" aria-label="Laskutoimituksen vastaus" data-i18n-attr-placeholder="vieraskirja.vastaus" data-i18n-attr-aria-label="vieraskirja.laskutoimituksen_vastaus">
                        <button type="button" onclick="uusiCaptcha()" class="nappula nappi-pieni" aria-label="Arvo uusi laskutoimitus" title="Arvo uusi laskutoimitus" data-i18n-attr-aria-label="vieraskirja.arvo_uusi_laskutoimitus" data-i18n-attr-title="vieraskirja.arvo_uusi_laskutoimitus">🔄</button>
                    </div>
                    <button type="button" onclick="lahetaViesti()" id="btn-laheta" class="nappula nappi-oranssi" data-i18n="vieraskirja.lähetä_viesti">Lähetä viesti</button>
                </div>
            </div>

            <!-- Viestilista -->
            <div id="viestit-osio">
                <div style="text-align: center; padding: 20px;">
                    <div class="lataus-spinner"></div>
                </div>
            </div>
        </main>

        <a href="../" class="linkki-takaisin" data-i18n="common.takaisin_pääsivulle_nuoli">← Takaisin pääsivulle</a>
    </div>

    <script src="/js/inline/vieraskirja__index__inline_1.js"></script>
</body>
</html>
